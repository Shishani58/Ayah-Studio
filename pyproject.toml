[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ayah-studio"
version = "0.2.0"
description = "Generate per-ayah timecodes for Qur'an recitation audio, with visual/audio verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayah Studio contributors" }]
keywords = ["quran", "forced-alignment", "timecodes", "ayah", "recitation"]

# Core is the full shipped runtime: GUI (dashboard + review), DB I/O, decode,
# metric AND timing generation. Generation runs the int8 ONNX model
# (models/wav2vec2-quran-phonetics.onnx) via onnxruntime + the vendored CTC
# Viterbi (surah_cutter.core._ctc) + the vendored per-word transliteration cache
# (data/word_tr_cache.json). No torch, transformers, librosa or HF at runtime.
dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.17",       # Silero VAD + int8 acoustic model (alignment)
    "soundfile>=0.12",
    "imageio-ffmpeg>=0.4.9",   # bundled cross-platform ffmpeg binary for decode
    "fastapi>=0.110",          # local web-GUI server (API + SSE progress)
    "uvicorn>=0.27",           # ASGI server for the web GUI
    "pywebview>=4.4",          # native window via the system WebView (no Chromium)
    "uv==0.9.2",              # isolated optional model runtimes, managed Python
]

[project.optional-dependencies]
# Dev/export only — NOT needed to run the app. Pulls the heavy torch stack used
# to (a) re-export the int8 ONNX model (tools/export_onnx.py) and refresh the
# transliteration cache, and (b) run the torch "oracle" backend
# (SURAH_CUTTER_ALIGN_BACKEND=torch) for ONNX↔torch parity checks in tests.
align = [
    "torch>=2.1",
    "transformers>=4.38",
    "onnx>=1.15",              # graph load/inspect for export
    "onnxscript>=0.1",         # torch.onnx export dependency
    "ctc-forced-aligner",      # torch CTC oracle (parity reference for _ctc)
    "librosa>=0.10",           # audio loading inside ctc-forced-aligner
    "pyarrow>=14",             # read the transliteration dataset (text columns)
    "huggingface-hub>=0.20",   # fetch model + transliteration dataset
]
# Back-compat alias for the old extra name.
oracle = [
    "ayah-studio[align]",
]
# Legacy PySide6/Qt desktop GUI (surah_cutter.gui). The shipped GUI is now the
# lightweight web UI (surah_cutter.webgui); Qt is optional and heavy (~1.2 GB).
qt = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]
ten-vad = [
    "ten_vad>=1.0.6.8",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
build = [
    "pyinstaller>=6.16,<7",
]

[project.scripts]
ayah-studio = "surah_cutter.webgui.launch:main"
ayah-studio-cli = "surah_cutter.cli:main"
surah-cutter = "surah_cutter.cli:main"
surah-cutter-gui = "surah_cutter.webgui.launch:main"
surah-cutter-gui-qt = "surah_cutter.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["surah_cutter"]

[tool.hatch.build.targets.wheel.force-include]
"data/quran_mushaf.db" = "surah_cutter/bundled/data/quran_mushaf.db"
"data/word_tr_cache.json" = "surah_cutter/bundled/data/word_tr_cache.json"
"data/model_text_targets.json" = "surah_cutter/bundled/data/model_text_targets.json"
"data/references" = "surah_cutter/bundled/data/references"
"assets/fonts/qpc_hafs.ttf" = "surah_cutter/bundled/assets/fonts/qpc_hafs.ttf"

[tool.ruff]
line-length = 100
target-version = "py310"
