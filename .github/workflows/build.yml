name: build

# Build the windowed GUI app on macOS + Windows.
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab.
on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build only Windows x64
        type: boolean
        default: false
      release_tag:
        description: Existing release to attach assets to (empty = artifacts only)
        type: string
        default: ""

permissions:
  contents: write  # the release job needs this to attach assets

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev pytest -q

  models:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/model-export-requirements.txt
      - name: Prepare runtime models from pinned sources
        if: vars.AYAH_MODELS_URL == ''
        run: python -m tools.prepare_models
      - name: Fetch optional prebuilt runtime models
        if: vars.AYAH_MODELS_URL != ''
        env:
          AYAH_MODELS_URL: ${{ vars.AYAH_MODELS_URL }}
          AYAH_MODELS_SHA256: ${{ vars.AYAH_MODELS_SHA256 }}
        run: python tools/fetch_runtime_models.py
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-models
          path: models/*
          if-no-files-found: error

  build:
    needs: models
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_only && '[{"os":"windows-latest","artifact":"ayah-studio-windows"}]' || '[{"os":"macos-latest","artifact":"ayah-studio-macos"},{"os":"windows-latest","artifact":"ayah-studio-windows"}]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + build deps
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --locked --extra build

      - uses: actions/download-artifact@v4
        with:
          name: runtime-models
          path: models

      - name: Build with PyInstaller
        if: runner.os == 'Windows'
        run: uv run --locked --extra build pyinstaller surah_cutter.spec --noconfirm --clean

      # Package dist/ into a single archive per platform so the artifact
      # keeps the bundle structure (the app reads data/ siblings at runtime).
      - name: Build DMG (macOS)
        if: runner.os == 'macOS'
        run: uv run --locked --extra build python tools/build_macos.py

      - name: Verify and archive Windows app
        if: runner.os == 'Windows'
        run: ./tools/package_windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/*.zip
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.sha256
            artifacts/**/*.zip
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          body_path: ${{ startsWith(github.ref, 'refs/tags/v') && '.github/release-notes.md' || '' }}
