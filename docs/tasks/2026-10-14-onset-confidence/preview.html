<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сигнал начала — проверка</title><style>body{font-family:system-ui;margin:24px;background:#f8fafb;color:#203331}main{max-width:720px;margin:auto}article{margin:16px 0;background:white;padding:18px;border:1px solid #dbe6e2;border-radius:12px}.arabic{font-size:24px;line-height:1.8;text-align:right} .scores{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.old{color:#777}.timing-confidence[data-level="high"]{color:#16824e}.timing-confidence[data-level="medium"]{color:#876100}.timing-confidence[data-level="low"]{color:#b54235}p.note{color:#526561;font-size:13px}</style><main><h1>Сигнал начала</h1><p>Слева — прежняя оценка всего слова. Справа — поддержка звука в позиции начала.</p><div id="cases"></div><p class="note">Проценты показывают акустическую поддержку; точность времени проверяется на слух.</p></main><script>const uiLanguage="ru";const t=(v,...values)=>typeof v==="string"?v:v.reduce((s,p,i)=>s+p+(values[i]??""),"");function timingConfidence(item) {
  const evidence = item.onset_evidence;
  const hasOnset = evidence && typeof evidence.first_sound === "number"
    && Number.isFinite(evidence.first_sound) && evidence.first_sound >= 0 && evidence.first_sound <= 1;
  const value = hasOnset ? evidence.first_sound : item.confidence;
  if (item.time == null || item.stale || item.status === "edited"
      || typeof value !== "number" || !Number.isFinite(value) || value < 0 || value > 1) {
    return { level: "unknown", label: t("Сигнал: нет оценки"),
      title: t("Для этой метки нет акустической оценки. Проверьте начало на слух.") };
  }
  const level = value >= 0.66 ? "high" : value >= 0.33 ? "medium" : "low";
  const format = number => new Intl.NumberFormat(uiLanguage, { style: "percent", maximumFractionDigits: 1 }).format(number);
  const percent = format(value);
  if (hasOnset) {
    const word = evidence.word;
    const wordLabel = typeof word === "number" && Number.isFinite(word) && word >= 0 && word <= 1
      ? t` Первое слово целиком: ${format(word)}.` : "";
    return { level: evidence.boundary_warning ? "medium" : level,
      label: evidence.boundary_warning ? t("Начало: проверить") : t`Звук начала: ${percent}`,
      title: t("Поддержка первого звука в позиции метки.") + wordLabel + " "
        + t("Это не вероятность точного времени. Проверьте начало на слух.") };
  }
  return { level, label: t`Модель: ${percent}`,
    title: t("Сохранённая оценка модели. Отдельной оценки начального звука нет; процент не измеряет точность времени.") };
}
const cases=[{"ayah": 218, "time": 4793798, "status": "auto", "confidence": 0.4479, "onset_evidence": {"first_sound": 0.9967, "word": 0.4479, "boundary_warning": false}, "text": "إِنَّ ٱلَّذِينَ ءَامَنُواْ وَٱلَّذِينَ هَاجَرُواْ وَجَٰهَدُواْ فِي سَبِيلِ ٱللَّهِ أُوْلَٰٓئِكَ يَرۡجُونَ رَحۡمَتَ ٱللَّهِۚ وَٱللَّهُ غَفُورٞ رَّحِيمٞ"}, {"ayah": 219, "time": 4815677, "status": "auto", "confidence": 0.5082, "onset_evidence": {"first_sound": 0.5452, "word": 0.5082, "boundary_warning": false}, "text": "۞ يَسۡـَٔلُونَكَ عَنِ ٱلۡخَمۡرِ وَٱلۡمَيۡسِرِۖ قُلۡ فِيهِمَآ إِثۡمٞ كَبِيرٞ وَمَنَٰفِعُ لِلنَّاسِ وَإِثۡمُهُمَآ أَكۡبَرُ مِن نَّفۡعِهِمَاۗ وَيَسۡـَٔلُونَكَ مَاذَا يُنفِقُونَۖ قُلِ ٱلۡعَفۡوَۗ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمُ ٱلۡأٓيَٰتِ لَعَلَّكُمۡ تَتَفَكَّرُونَ"}, {"ayah": 220, "time": 4843477, "status": "auto", "confidence": 0.0, "onset_evidence": {"first_sound": 0.0002, "word": 0.0, "boundary_warning": false}, "text": "فِي ٱلدُّنۡيَا وَٱلۡأٓخِرَةِۗ وَيَسۡـَٔلُونَكَ عَنِ ٱلۡيَتَٰمَىٰۖ قُلۡ إِصۡلَاحٞ لَّهُمۡ خَيۡرٞۖ وَإِن تُخَالِطُوهُمۡ فَإِخۡوَٰنُكُمۡۚ وَٱللَّهُ يَعۡلَمُ ٱلۡمُفۡسِدَ مِنَ ٱلۡمُصۡلِحِۚ وَلَوۡ شَآءَ ٱللَّهُ لَأَعۡنَتَكُمۡۚ إِنَّ ٱللَّهَ عَزِيزٌ حَكِيمٞ"}, {"ayah": 221, "time": 4872457, "status": "auto", "confidence": 0.9959, "onset_evidence": {"first_sound": 0.9996, "word": 0.9959, "boundary_warning": false}, "text": "وَلَا تَنكِحُواْ ٱلۡمُشۡرِكَٰتِ حَتَّىٰ يُؤۡمِنَّۚ وَلَأَمَةٞ مُّؤۡمِنَةٌ خَيۡرٞ مِّن مُّشۡرِكَةٖ وَلَوۡ أَعۡجَبَتۡكُمۡۗ وَلَا تُنكِحُواْ ٱلۡمُشۡرِكِينَ حَتَّىٰ يُؤۡمِنُواْۚ وَلَعَبۡدٞ مُّؤۡمِنٌ خَيۡرٞ مِّن مُّشۡرِكٖ وَلَوۡ أَعۡجَبَكُمۡۗ أُوْلَٰٓئِكَ يَدۡعُونَ إِلَى ٱلنَّارِۖ وَٱللَّهُ يَدۡعُوٓاْ إِلَى ٱلۡجَنَّةِ وَٱلۡمَغۡفِرَةِ بِإِذۡنِهِۦۖ وَيُبَيِّنُ ءَايَٰتِهِۦ لِلنَّاسِ لَعَلَّهُمۡ يَتَذَكَّرُونَ"}];for(const item of cases){const e=timingConfidence(item);const a=document.createElement('article');const h=document.createElement('b');h.textContent='Аят '+item.ayah;const text=document.createElement('p');text.className='arabic';text.dir='rtl';text.textContent=item.text;const scores=document.createElement('div');scores.className='scores';const old=document.createElement('span');old.className='old';old.textContent='Раньше: '+new Intl.NumberFormat('ru',{style:'percent',maximumFractionDigits:1}).format(item.confidence);const score=document.createElement('span');score.className='timing-confidence';score.dataset.level=e.level;score.textContent=e.label;score.title=e.title;scores.append(old,score);a.append(h,text,scores);document.querySelector('#cases').append(a);}</script></html>
